name: refresh-data
on:
  schedule:
    - cron: '25 8 * * 1-5'   # UTC 08:25 = 北京 16:25, A股收盘后
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch quotes & rebuild page
        run: |
          python _src/fetch_kline.py
          python _src/gen_tracking.py
          python _src/gen_html.py
          cp /tmp/tracking.html index.html
          cp /tmp/kline_all.json /tmp/etf_all.json _src/
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html _src/
          git diff --cached --quiet || (git commit -m "auto: refresh static base $(date -u '+%F %R')" && git push)
